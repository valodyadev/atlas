name: Release

# Tag-driven releases. The tag is the artefact's identity: `v1.4.0` produces
# images tagged with that version AND with the commit digest, so a rollback is
# "deploy the previous digest" rather than "rebuild and hope".
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-flight

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write        # for keyless artefact signing, if enabled
    strategy:
      matrix:
        include:
          - name: atlas-api
            dockerfile: backend/src/Atlas.Api/Dockerfile
            context: .
          - name: atlas-db-migrator
            dockerfile: backend/src/Atlas.DbMigrator/Dockerfile
            context: .
          - name: atlas-node-worker
            dockerfile: services/node-worker/Dockerfile
            context: services/node-worker
          - name: atlas-python-worker
            dockerfile: services/python-worker/Dockerfile
            context: services/python-worker

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and provenance attestation per image: when the next
          # critical CVE lands, "which of our images contains it?" becomes a
          # query rather than an investigation.
          provenance: true
          sbom: true

  # ---------------------------------------------------------------------------
  # Deployment is intentionally a stub.
  #
  # Filling this in requires decisions this starter cannot make for you: which
  # cluster, how credentials are federated (OIDC, please - not a long-lived
  # secret), and whether you push from CI or let a GitOps controller pull.
  # The shape below is the order that matters: migrate, then release.
  # ---------------------------------------------------------------------------
  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A GitHub Environment gives you required reviewers and deployment history
    # for free. Configure it under Settings -> Environments.
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - name: Render the manifests
        run: |
          OVERLAY="${{ github.event.inputs.environment || 'dev' }}"
          echo "Would apply infra/k8s/overlays/${OVERLAY} at ${{ github.ref_name }}"
          echo
          echo "Deployment order is load-bearing:"
          echo "  1. run the db-migrator Job to completion"
          echo "  2. only then roll the API Deployment"
          echo
          echo "Migrations must be backward compatible with the OUTGOING version,"
          echo "because both versions serve traffic during a rolling deploy."
          echo "See docs/runbooks/database-migrations.md."

      - name: Deploy
        run: |
          echo "::notice::Deployment is not configured yet - see .github/workflows/release.yml"
