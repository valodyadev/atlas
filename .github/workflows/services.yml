name: Services

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/services.yml'
  pull_request:
    paths:
      - 'services/**'
      - '.github/workflows/services.yml'

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Each service is gated independently, and only when it changed. Adding a
  # third service means adding a job here, not slowing the other two down.
  node-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/node-worker

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: services/node-worker/package.json
          cache: npm
          cache-dependency-path: services/node-worker/package-lock.json

      # `npm ci` installs the lockfile exactly; `npm install` would silently
      # resolve a newer tree than the one that was reviewed.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/python-worker

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: services/python-worker/uv.lock

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest
