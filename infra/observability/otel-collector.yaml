# ---------------------------------------------------------------------------
# OpenTelemetry Collector configuration for local development.
#
# Every service exports OTLP to this collector and nothing vendor-specific.
# Changing observability vendor means editing the `exporters` block here and
# redeploying the collector - not touching application code. That indirection
# is the whole reason the collector exists.
# ---------------------------------------------------------------------------
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Required: unbatched export is one network round trip per span.
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Protects the collector from an upstream traffic spike.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics scrape target for a local Prometheus, if you add one.
  prometheus:
    endpoint: 0.0.0.0:8889

  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: warn
