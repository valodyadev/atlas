# Migrations run as a Job, before the new API version is released.
#
# Not as an init container (every replica would race to migrate) and not at
# API startup (two replicas rolling at once would both try, and a migration
# could not be reviewed, timed or rolled back independently of a deploy).
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-db-migrator
  labels:
    app.kubernetes.io/name: atlas-db-migrator
    app.kubernetes.io/component: migration
  annotations:
    # CI appends the build id to the name so each deploy gets its own Job.
    atlas.dev/description: "Applies pending EF Core migrations, then exits."
spec:
  backoffLimit: 2
  # Keep finished jobs around briefly so the logs are retrievable after a
  # failed deploy, then clean up automatically.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-db-migrator
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: ghcr.io/valodyadev/atlas-db-migrator:PLACEHOLDER
          envFrom:
            - configMapRef:
                name: atlas-api-config
            - secretRef:
                name: atlas-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
