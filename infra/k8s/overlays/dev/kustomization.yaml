apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: atlas-dev
nameSuffix: -dev

resources:
  - ../../base

# Non-secret configuration only. The connection string's password comes from
# the atlas-api-secrets Secret, created by the secret-manager operator.
configMapGenerator:
  - name: atlas-api-config
    literals:
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Auth__Enabled=false
      - RateLimit__PermitLimit=10000

patches:
  - target:
      kind: Deployment
      name: atlas-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: ghcr.io/valodyadev/atlas-api
    newTag: dev
  - name: ghcr.io/valodyadev/atlas-db-migrator
    newTag: dev
