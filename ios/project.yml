# ---------------------------------------------------------------------------
# XcodeGen project specification.
#
# The .xcodeproj is GENERATED and NOT committed. Why:
#   * .pbxproj merge conflicts are the single most common source of friction
#     on a growing iOS team, and they are unreviewable;
#   * build settings become reviewable text (this file plus App/Config/*.xcconfig);
#   * every developer and CI runner gets a byte-identical project.
#
# Regenerate after pulling, or after adding a file:
#     make ios-project        (or: cd ios && xcodegen generate)
# ---------------------------------------------------------------------------
name: Atlas

options:
  bundleIdPrefix: com.atlas
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: false

# Three configurations, not two. Staging is a release-optimised build pointing
# at the staging backend, which is what TestFlight builds should be: a
# Debug-optimised build does not surface the performance and optimiser
# behaviour your users will actually get.
configs:
  Debug: debug
  Staging: release
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_MODULE_VERIFIER: YES

packages:
  AtlasKit:
    path: Packages/AtlasKit

targets:
  # No SwiftLint build phase on purpose. Base.xcconfig sets
  # ENABLE_USER_SCRIPT_SANDBOXING = YES, and a sandboxed build script cannot
  # read .swiftlint.yml or the wider source tree - the build fails with
  # "couldn't be opened because you don't have permission to view it".
  # Keeping the sandbox is worth more than in-IDE lint warnings: linting is
  # already enforced by `make lint` and by the ios.yml lint job.
  Atlas:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
        # Info.plist must NOT also be a bundle resource. Xcode processes it
        # separately via INFOPLIST_FILE, and having it in both places makes two
        # build tasks write the same output:
        #   error: Multiple commands produce '.../Atlas Dev.app/Info.plist'
        excludes:
          - "Info.plist"
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Staging: App/Config/Staging.xcconfig
      Release: App/Config/Release.xcconfig
    settings:
      base:
        # Point at the committed plist rather than XcodeGen's `info:` block,
        # which exists to GENERATE one. Ours is hand-written and version
        # controlled, so generation would be a trap.
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: AtlasKit
        product: AtlasCore
      - package: AtlasKit
        product: AtlasNetworking
      - package: AtlasKit
        product: AtlasDesignSystem
      - package: AtlasKit
        product: AtlasFeatureUsers
      - package: AtlasKit
        product: AtlasFeatureAuth
  AtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AtlasUITests
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Staging: App/Config/Staging.xcconfig
      Release: App/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlas.app.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Atlas

schemes:
  Atlas:
    build:
      targets:
        Atlas: all
        AtlasUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Atlas
      targets:
        - AtlasUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Atlas-Staging:
    build:
      targets:
        Atlas: all
    run:
      config: Staging
    archive:
      config: Staging
