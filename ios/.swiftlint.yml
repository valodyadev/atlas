# SwiftLint configuration.
#
# Philosophy: a small number of rules that catch real defects and genuine
# inconsistency, with the formatting left to SwiftFormat. A 200-rule config
# that everyone disables locally is worse than no config at all.

included:
  - App/Sources
  - Packages/AtlasKit/Sources
  - Tests

excluded:
  - Packages/AtlasKit/.build
  - DerivedData

analyzer_rules:
  - unused_import

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping           # a crash in production is not error handling
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - todo                       # TODOs are tracked in the issue tracker, not by the linter
  - trailing_comma             # SwiftFormat owns trailing commas

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 450
  error: 700
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length: 2
  excluded: [id, up, to, at, db, ok]

nesting:
  type_level: 2

# Tests legitimately break some of these: force-unwrapping a known-good
# literal is clearer than ceremony, and test bodies get long.
force_unwrapping:
  severity: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(?<!\w)print\('
    match_kinds: [identifier]
    message: "Use AtlasLog instead of print() so the message is captured on device."
    severity: error
  no_userdefaults_for_tokens:
    name: "No credentials in UserDefaults"
    regex: 'UserDefaults.*(token|password|secret|apiKey)'
    message: "Credentials belong in the Keychain; UserDefaults ends up in backups."
    severity: error
