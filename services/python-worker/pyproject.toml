[project]
name = "atlas-python-worker"
version = "0.1.0"
description = "Reference Python service for the Atlas platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "structlog>=25.4",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "httpx2>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_worker"]

# ---------------------------------------------------------------------------
# Ruff replaces black, isort, flake8 and most plugins with one fast tool.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ASYNC",     # async correctness: blocking calls in async defs
    "S",         # bandit security rules
    "RUF",
    "ANN",       # require type annotations
    "PT",        # pytest style
]
ignore = [
    "ANN401",    # explicit Any is sometimes the honest annotation
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may hardcode throwaway values.
"tests/**" = ["S101", "ANN201", "ANN001"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy in strict mode. A Python service without type checking becomes
# unrefactorable at about the ten-thousand-line mark.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_reexport = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pin the fixture loop scope explicitly rather than inheriting a default that
# pytest-asyncio has announced it will change.
asyncio_default_fixture_loop_scope = "function"
# -W error: a warning nobody sees is a warning nobody fixes.
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
